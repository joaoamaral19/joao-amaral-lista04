
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postagens dos Usuários</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            font-size: 25px;
        }

        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
        }

        .postagem {
            background-color: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .titulo {
            color: #0759a5;
            cursor: pointer;
            font-weight: bold;
        }

        .titulo:hover {
            text-decoration: underline;
        }

        .detalhes {
            margin-top: 15px;
            padding: 12px;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        .comentario {
            border-top: 1px solid #ccc;
            padding: 10px 0;
        }

        .erro {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Postagens dos Usuários</h1>

    <label for="usuario">Selecione um autor:</label>

    <select id="usuario">
        <option value="">Carregando usuários...</option>
    </select>

    <div id="postagens"></div>

    <script>
        const usuarioSelect = document.getElementById("usuario");
        const postagensDiv = document.getElementById("postagens");

        // 1. Buscar todos os usuários
        async function carregarUsuarios() {
            try {
                const resposta = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar usuários.");
                }

                const usuarios = await resposta.json();

                usuarioSelect.innerHTML =
                    '<option value="">Selecione um autor</option>';

                usuarios.forEach(usuario => {
                    const opcao = document.createElement("option");

                    opcao.value = usuario.id;
                    opcao.textContent = usuario.name;

                    usuarioSelect.appendChild(opcao);
                });

            } catch (erro) {
                usuarioSelect.innerHTML =
                    '<option value="">Erro ao carregar usuários</option>';

                console.error(erro);
            }
        }

        // 2. Buscar postagens do usuário selecionado
        async function carregarPostagens(userId) {
            postagensDiv.innerHTML = "Carregando postagens...";

            try {
                const resposta = await fetch(
                    `https://jsonplaceholder.typicode.com/posts?userId=${userId}`
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar postagens.");
                }

                const postagens = await resposta.json();

                postagensDiv.innerHTML = "<h2>Postagens:</h2>";

                postagens.forEach(postagem => {
                    const div = document.createElement("div");

                    div.className = "postagem";

                    div.innerHTML = `
                        <p class="titulo"
                           onclick="carregarDetalhes(${postagem.id}, this)">
                            ${postagem.title}
                        </p>

                        <div class="detalhes"></div>
                    `;

                    postagensDiv.appendChild(div);
                });

            } catch (erro) {
                postagensDiv.innerHTML =
                    "<p class='erro'>Não foi possível carregar as postagens.</p>";

                console.error(erro);
            }
        }

        // 3. Buscar postagem completa e comentários
        async function carregarDetalhes(postId, elemento) {
            const detalhes = elemento.nextElementSibling;

            detalhes.innerHTML = "Carregando conteúdo e comentários...";

            try {
                const [respostaPostagem, respostaComentarios] =
                    await Promise.all([
                        fetch(
                            `https://jsonplaceholder.typicode.com/posts/${postId}`
                        ),
                        fetch(
                            `https://jsonplaceholder.typicode.com/posts/${postId}/comments`
                        )
                    ]);

                if (!respostaPostagem.ok || !respostaComentarios.ok) {
                    throw new Error("Erro ao buscar detalhes.");
                }

                const postagem = await respostaPostagem.json();
                const comentarios = await respostaComentarios.json();

                detalhes.innerHTML = `
                    <h3>${postagem.title}</h3>

                    <p>${postagem.body}</p>

                    <h3>Comentários:</h3>

                    ${comentarios.map(comentario => `
                        <div class="comentario">
                            <strong>${comentario.name}</strong>
                            <p>${comentario.email}</p>
                            <p>${comentario.body}</p>
                        </div>
                    `).join("")}
                `;

            } catch (erro) {
                detalhes.innerHTML =
                    "<p class='erro'>Erro ao carregar os detalhes.</p>";

                console.error(erro);
            }
        }

        // Detectar quando um usuário for selecionado
        usuarioSelect.addEventListener("change", function () {
            const userId = usuarioSelect.value;

            if (userId === "") {
                postagensDiv.innerHTML = "";
                return;
            }

            carregarPostagens(userId);
        });

        // Iniciar o carregamento dos usuários
        carregarUsuarios();
    </script>

</body>
</html>
